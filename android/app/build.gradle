apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

//FIREBASE
apply plugin: 'com.google.gms.google-services'

/**
 * Configuration block of the React Native Android app.
 * Nothing needs configuring by default; just uncomment the lines you need.
 */
react {
    /* Folders */
    //   Project root, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   Folder of the react-native NPM package. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   Folder of the react-native Codegen package. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file, the React Native CLI entry point. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   List of debuggable variants: the JS bundle and assets are not built for them.
    //   Default is "debug", "debugOptimized".
    //   When adding flavors (lite, prod, etc.), list them in debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundle build */
    //   The node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   Bundle build command. Default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   Path to the CLI config file. Empty by default.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   Name of the generated JS bundle asset file
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   Entry file for the bundle build. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   Extra flags for the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes commands */
    //   Hermes compiler command. Default is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   Hermes compiler flags. Default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * true enables Proguard in release builds to minify Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Preferred JavaScriptCore (JSC) build flavor
 *
 * For example, for the international variant:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes the ICU i18n library and data, with which,
 * for example, `Date.toLocaleString` and `String.localeCompare` work correctly
 * with locales other than en-US. This variant is about 6 MiB larger than the
 * standard one per architecture.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.web2appshell"
    defaultConfig {
        applicationId "com.web2appshell"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Warning! For production you need to generate your own keystore.
            // See https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The react-native version is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
