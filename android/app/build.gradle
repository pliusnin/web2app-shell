apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

//FIREBASE
apply plugin: 'com.google.gms.google-services'

/**
 * Блок настройки Android-приложения React Native.
 * По умолчанию настраивать ничего не нужно, достаточно раскомментировать нужные строки.
 */
react {
    /* Папки */
    //   Корень проекта, т. е. где лежит "package.json". По умолчанию '../..'
    // root = file("../../")
    //   Папка NPM-пакета react-native. По умолчанию ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   Папка пакета Codegen react-native. По умолчанию ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   Файл cli.js — точка входа React Native CLI. По умолчанию ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Варианты */
    //   Список отлаживаемых вариантов: для них JS-бандл и ассеты не собираются.
    //   По умолчанию "debug", "debugOptimized".
    //   При добавлении flavors (lite, prod и т. п.) перечислите их debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Сборка бандла */
    //   Команда node и её флаги. По умолчанию просто 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   Команда сборки бандла. По умолчанию 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   Путь к файлу конфигурации CLI. По умолчанию пусто.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   Имя генерируемого файла ассета с JS-бандлом
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   Входной файл для сборки бандла. По умолчанию 'index.android.js' или 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   Дополнительные флаги для команд 'bundle'.
    //   См. https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Команды Hermes */
    //   Команда компилятора Hermes. По умолчанию 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   Флаги компилятора Hermes. По умолчанию "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * true включает Proguard в release-сборках для минификации Java-байткода.
 */
def enableProguardInReleaseBuilds = false

/**
 * Предпочтительный flavor сборки JavaScriptCore (JSC)
 *
 * Например, для международного варианта:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * Международный вариант включает библиотеку ICU i18n и данные, с которыми,
 * например, `Date.toLocaleString` и `String.localeCompare` работают корректно
 * с локалями кроме en-US. Этот вариант примерно на 6 МиБ больше стандартного
 * на каждую архитектуру.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.web2appshell"
    defaultConfig {
        applicationId "com.web2appshell"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Внимание! Для production нужно сгенерировать собственный keystore.
            // См. https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // Версию react-native задаёт React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
