# Настройки Gradle для всего проекта.

# Для пользователей IDE (например, Android Studio):
# настройки Gradle, заданные через IDE, *переопределяют*
# любые настройки из этого файла.

# Подробнее о настройке окружения сборки:
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Аргументы JVM для процесса демона.
# Особенно полезно для настройки памяти.
# Значение по умолчанию: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Если задано, Gradle работает в экспериментальном параллельном режиме.
# Используйте только для независимых (decoupled) проектов. Подробнее:
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Структура пакетов AndroidX: видно, какие пакеты входят в ОС Android,
# а какие упакованы в APK приложения
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Архитектуры, под которые идёт сборка.
# Можно переопределить из CLI:
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Включает поддержку новой архитектуры:
# TurboModules и рендерер Fabric в приложении. Включайте флаг,
# если пишете свои TurboModules/Fabric-компоненты ИЛИ используете
# библиотеки, которые их предоставляют.
newArchEnabled=true

# Включает или выключает JS-движок Hermes.
# При false вместо него используется JSC.
hermesEnabled=true

# Включает поддержку отображения edge-to-edge:
# приложение рисует под системными панелями для immersive UI.
# Работает только с ReactActivity, не используйте со своей Activity.
edgeToEdgeEnabled=true

# Отказ от встроенного kotlin и нового поведения DSL из AGP 9.
# Начиная с AGP 10.x эти отказы будут удалены.
android.builtInKotlin=false
android.newDsl=false