# Project-wide Gradle settings.

# For IDE users (e.g. Android Studio):
# Gradle settings configured through the IDE *override*
# any settings from this file.

# More about configuring the build environment:
# http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for the daemon process.
# Especially useful for tuning memory.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When set, Gradle runs in the experimental parallel mode.
# Use it only for decoupled projects. More info:
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure: shows which packages are part of the Android OS
# and which are bundled into the app APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Architectures to build for.
# Can be overridden from the CLI:
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enables New Architecture support:
# TurboModules and the Fabric renderer in the app. Turn the flag on
# if you write your own TurboModules/Fabric components OR use
# libraries that provide them.
newArchEnabled=true

# Enables or disables the Hermes JS engine.
# When false, JSC is used instead.
hermesEnabled=true

# Enables edge-to-edge display support:
# the app draws under the system bars for an immersive UI.
# Works only with ReactActivity, do not use it with your own Activity.
edgeToEdgeEnabled=true

# Opt-out of built-in kotlin and the new DSL behavior from AGP 9.
# Starting with AGP 10.x these opt-outs will be removed.
android.builtInKotlin=false
android.newDsl=false